<?xml version="1.0" encoding="UTF-8"?>
<!-- Cleaner app icon: original geometry — layered storage + sweep sparkle (no third-party artwork). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="8%" y1="6%" x2="92%" y2="94%">
      <stop offset="0%" stop-color="#6EE7D8"/>
      <stop offset="38%" stop-color="#14B8A6"/>
      <stop offset="72%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="gloss" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BBF7D0"/>
      <stop offset="55%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="layerBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="layerMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="layerFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#042F2E" flood-opacity="0.28"/>
    </filter>
    <symbol id="sparkle" viewBox="-24 -24 48 48">
      <path
        d="M 0 -22 C 2 -10 10 -2 22 0 C 10 2 2 10 0 22 C -2 10 -10 2 -22 0 C -10 -2 -2 -10 0 -22 Z"
        fill="#FFFFFF"
      />
    </symbol>
  </defs>

  <!-- macOS squircle canvas -->
  <rect x="64" y="64" width="896" height="896" rx="198" ry="198" fill="url(#bg)"/>
  <ellipse cx="512" cy="268" rx="330" ry="190" fill="url(#gloss)"/>

  <!-- Stacked layers: caches / volumes -->
  <g filter="url(#cardShadow)">
    <rect x="268" y="548" width="488" height="76" rx="22" fill="url(#layerBack)"/>
    <rect x="292" y="464" width="440" height="76" rx="22" fill="url(#layerMid)"/>
    <rect x="316" y="372" width="392" height="88" rx="24" fill="url(#layerFront)"/>
    <rect x="356" y="408" width="312" height="12" rx="6" fill="#0E7490" opacity="0.22"/>
    <rect x="356" y="432" width="248" height="10" rx="5" fill="#0E7490" opacity="0.16"/>
    <circle cx="652" cy="416" r="14" fill="#34D399"/>
  </g>

  <!-- Clean sweep arc -->
  <path
    d="M 248 748 C 360 500 664 500 776 748"
    fill="none"
    stroke="url(#sweep)"
    stroke-width="68"
    stroke-linecap="round"
  />
  <circle cx="248" cy="748" r="30" fill="url(#sweep)"/>
  <circle cx="776" cy="748" r="30" fill="url(#sweep)"/>

  <!-- Sparkles: freed space / performance boost -->
  <use href="#sparkle" x="748" y="318" width="52" height="52" opacity="0.95"/>
  <use href="#sparkle" x="812" y="268" width="34" height="34" opacity="0.78"/>
  <use href="#sparkle" x="688" y="252" width="24" height="24" opacity="0.62"/>
</svg>
